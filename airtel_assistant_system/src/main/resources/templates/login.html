<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airtel Assistant | Secure Login</title>
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: #1e1e1e; padding: 40px; border-radius: 12px; width: 380px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid #333; }
        h1 { color: #e11d48; font-size: 26px; margin-bottom: 30px; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #e11d48; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 16px; }
        
        /* STATIC DEVELOPER SECTION */
        .dev-footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #333; }
        .dev-names { font-size: 13px; color: #888; line-height: 1.6; }
        .req-creds { font-size: 11px; color: #444; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>AIRTEL LOGIN</h1>
        
        <form th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">ACCESS SYSTEM</button>
        </form>

        <div class="dev-footer">
            <div class="dev-names">
                <strong>Developed by:</strong><br>
                Blando & Noella
            </div>
            <div class="req-creds">
                System Access: 24RP04662 / 24RP08537
            </div>
        </div>
    </div>
</body>
</html>
