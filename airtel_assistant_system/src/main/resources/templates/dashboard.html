<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airtel Asset Management | Dashboard</title>
    <style>
        :root { --airtel-red: #e11d48; --dark-bg: #121212; --panel-bg: #1e1e1e; --text-dim: #888; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .top-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .welcome-text { color: var(--airtel-red); font-size: 24px; font-weight: bold; margin: 0; }
        .role-text { color: var(--text-dim); font-style: italic; margin: 0; }
        .logout-btn { background: #282828; border: 1px solid var(--airtel-red); color: white; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--panel-bg); border: 1px solid var(--airtel-red); padding: 20px; text-align: center; border-radius: 4px; }
        .stat-title { color: var(--text-dim); font-size: 12px; text-transform: uppercase; margin-bottom: 10px; }
        .stat-value { font-size: 36px; font-weight: bold; }
        .actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .action-link { text-decoration: none; display: block; }
        .action-btn { width: 100%; background: #2d2d2d; border: 1px solid #444; color: white; padding: 25px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .action-btn:hover { background: #3d3d3d; border-color: var(--airtel-red); }
        .admin-btn { border-color: cyan; }
    </style>
</head>
<body>

    <div class="top-panel">
        <div>
            <p class="welcome-text" th:text="'Welcome: ' + ${username}"></p>
            <p class="role-text" th:text="'Access: ' + ${role}"></p>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="logout-btn">LOGOUT</button>
        </form>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-title">Total Assets</div>
            <div class="stat-value" th:text="${total}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Assigned</div>
            <div class="stat-value" th:text="${assigned}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Available</div>
            <div class="stat-value" th:text="${available}">0</div>
        </div>
    </div>

    <div class="actions-grid">
        <a th:href="@{/assets/add}" class="action-link"><button class="action-btn">Add Asset</button></a>
        <a th:href="@{/assets/assign}" class="action-link"><button class="action-btn">Assign Asset</button></a>
        <a th:href="@{/assets/return}" class="action-link"><button class="action-btn">Return Asset</button></a>
        
        <a th:href="@{/search}" class="action-link"><button class="action-btn">Search</button></a>
        
        <a th:if="${role == 'ADMIN'}" th:href="@{/admin/audit}" class="action-link">
            <button class="action-btn">Audit Logs</button>
        </a>
        <a th:if="${role == 'ADMIN'}" th:href="@{/admin/reports}" class="action-link">
            <button class="action-btn">Reports</button>
        </a>
        <a th:if="${role == 'ADMIN'}" th:href="@{/admin/users}" class="action-link">
            <button class="action-btn admin-btn">Manage Users</button>
        </a>
    </div>

</body>
</html>
