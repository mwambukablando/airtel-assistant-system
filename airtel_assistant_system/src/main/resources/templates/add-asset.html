<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airtel | Register New Asset</title>
    <style>
        :root { --airtel-red: #e11d48; --dark-bg: #121212; --panel-bg: #1e1e1e; --text-dim: #888; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        .container { max-width: 1000px; margin: auto; }
        .form-card { background: var(--panel-bg); padding: 30px; border-radius: 8px; border: 1px solid #333; margin-bottom: 30px; }
        .header { color: var(--airtel-red); font-size: 24px; font-weight: bold; margin-bottom: 25px; }
        
        .grid-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { color: var(--text-dim); font-size: 12px; margin-bottom: 8px; }
        input { background: #2d2d2d; border: 1px solid #444; color: white; padding: 12px; border-radius: 4px; }
        
        /* Button Container */
        .button-row { display: flex; gap: 15px; margin-top: 25px; }
        .btn-save { flex: 2; background: var(--airtel-red); color: white; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-back { flex: 1; background: #444; color: white; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; text-decoration: none; text-align: center; }
        .btn-back:hover { background: #555; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--panel-bg); }
        th { text-align: left; color: var(--airtel-red); padding: 15px; border-bottom: 2px solid #333; }
        td { padding: 15px; border-bottom: 1px solid #333; color: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div class="form-card">
        <div class="header">Register New Asset</div>
        
        <form th:action="@{/assets/save}" method="post">
            <div class="grid-form">
                <div class="input-group">
                    <label>Asset Tag</label>
                    <input type="text" name="assetTag" placeholder="AT-001" required>
                </div>
                <div class="input-group">
                    <label>Device Name</label>
                    <input type="text" name="deviceName" placeholder="Laptop" required>
                </div>
                <div class="input-group">
                    <label>Serial Number</label>
                    <input type="text" name="serialNumber" placeholder="SN-123" required>
                </div>
                <div class="input-group">
                    <label>Brand</label>
                    <input type="text" name="brand" placeholder="HP / Lenovo">
                </div>
                <div class="input-group">
                    <label>Model</label>
                    <input type="text" name="modelName" placeholder="EliteBook">
                </div>
                <div class="input-group">
                    <label>Category</label>
                    <input type="text" name="category" placeholder="IT Hardware">
                </div>
            </div>
            
            <div class="button-row">
                <button type="submit" class="btn-save">ADD TO INVENTORY</button>
                <a th:href="@{/dashboard}" class="btn-back">BACK TO DASHBOARD</a>
            </div>
        </form>
    </div>

    <h3>CURRENT INVENTORY</h3>
    <table>
        <thead>
            <tr>
                <th>Tag</th>
                <th>Device</th>
                <th>Brand</th>
                <th>Serial</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="asset : ${assets}">
                <td th:text="${asset.assetTag}"></td>
                <td th:text="${asset.deviceName}"></td>
                <td th:text="${asset.brand}"></td>
                <td th:text="${asset.serialNumber}"></td>
                <td th:text="${asset.status}"></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
