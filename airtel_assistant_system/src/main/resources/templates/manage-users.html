<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airtel | Manage Users</title>
    <style>
        :root { --airtel-red: #e11d48; --dark-bg: #121212; --panel-bg: #1e1e1e; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Fixed Form Layout */
        .form-card { background: var(--panel-bg); padding: 25px; border-radius: 8px; border: 1px solid #333; }
        .input-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr auto; 
            gap: 20px; 
            align-items: flex-end; 
        }
        .input-group { display: flex; flex-direction: column; }
        label { color: var(--airtel-red); font-size: 12px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        input { background: #2d2d2d; border: 1px solid #444; color: white; padding: 12px; border-radius: 4px; width: 100%; }
        input:focus { border-color: var(--airtel-red); outline: none; }
        
        .btn-red { background: var(--airtel-red); color: white; border: none; padding: 13px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; height: 45px; }
        .btn-back { background: #333; color: white; text-decoration: none; padding: 10px 20px; border-radius: 4px; border: 1px solid #444; font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: var(--panel-bg); }
        th { text-align: left; color: var(--airtel-red); padding: 15px; border-bottom: 2px solid #333; font-size: 13px; }
        td { padding: 15px; border-bottom: 1px solid #333; color: #ccc; }
        .btn-delete { background: none; border: 1px solid #444; color: #ff4444; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 11px; }
        .btn-delete:hover { background: #ff4444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1 style="color: var(--airtel-red); margin: 0;">User Management</h1>
        <a th:href="@{/dashboard}" class="btn-back">BACK TO DASHBOARD</a>
    </div>

    <div class="form-card">
        <form th:action="@{/admin/users/save}" method="post" class="input-grid">
            <div class="input-group">
                <label>First Name</label>
                <input type="text" name="firstName" placeholder="e.g. Blando" required>
            </div>
            <div class="input-group">
                <label>Surname</label>
                <input type="text" name="lastName" placeholder="e.g. Musician" required>
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="blando.m" required>
            </div>
            <button type="submit" class="btn-red">CREATE USER</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Full Name</th>
                <th>Role</th>
                <th style="text-align: center;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.username}"></td>
                <td th:text="${u.fullName}"></td>
                <td th:text="${u.role}" th:style="${u.role == 'ADMIN' ? 'color: cyan;' : ''}"></td>
                <td style="text-align: center;">
                    <form th:if="${u.role != 'ADMIN'}" th:action="@{/admin/users/delete}" method="post">
                        <input type="hidden" name="username" th:value="${u.username}"/>
                        <button type="submit" class="btn-delete" onclick="return confirm('Remove this user?')">REMOVE</button>
                    </form>
                    <span th:if="${u.role == 'ADMIN'}" style="color: #555; font-size: 11px;">Protected</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
