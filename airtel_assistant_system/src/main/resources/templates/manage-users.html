<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airtel | Manage Users</title>
    <style>
        :root { --airtel-red: #e11d48; --dark-bg: #121212; --panel-bg: #1e1e1e; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .form-card { background: var(--panel-bg); padding: 25px; border-radius: 8px; border: 1px solid #333; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px; align-items: end; }
        label { color: #888; font-size: 12px; margin-bottom: 5px; display: block; }
        input { background: #2d2d2d; border: 1px solid #444; color: white; padding: 12px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .btn-red { background: var(--airtel-red); color: white; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-back { background: #333; color: white; text-decoration: none; padding: 10px 20px; border-radius: 4px; border: 1px solid #444; font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: var(--panel-bg); }
        th { text-align: left; color: var(--airtel-red); padding: 15px; border-bottom: 2px solid #333; }
        td { padding: 15px; border-bottom: 1px solid #333; color: #ccc; }

        /* Action Styles */
        .btn-delete { 
            background: none; 
            border: 1px solid #444; 
            color: #ff4444; 
            padding: 5px 10px; 
            cursor: pointer; 
            border-radius: 4px; 
            font-size: 12px; 
            transition: 0.3s;
        }
        .btn-delete:hover { 
            background: #ff4444; 
            color: white; 
            border-color: #ff4444; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1 style="color: var(--airtel-red); margin: 0;">User Management</h1>
        <a th:href="@{/dashboard}" class="btn-back">BACK TO DASHBOARD</a>
    </div>

    <div class="form-card">
        <form th:action="@{/admin/users/save}" method="post" class="input-grid">
            <div>
                <label>First Name</label>
                <input type="text" name="firstName" placeholder="e.g. Blando" required>
            </div>
            <div>
                <label>Surname</label>
                <input type="text" name="lastName" placeholder="e.g. Musician" required>
            </div>
            <div>
                <label>Username</label>
                <input type="text" name="username" placeholder="blando.m" required>
            </div>
            <button type="submit" class="btn-red">CREATE USER</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Full Name</th>
                <th>Access Role</th>
                <th style="text-align: center;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.username}"></td>
                <td th:text="${u.fullName}"></td>
                <td>
                    <span th:text="${u.role}" 
                          th:style="${u.role == 'ADMIN' ? 'color: cyan; font-weight: bold;' : 'color: #ccc;'}">
                    </span>
                </td>
                <td style="text-align: center;">
                    <form th:if="${u.role != 'ADMIN'}" th:action="@{/admin/users/delete}" method="post" style="display:inline;">
                        <input type="hidden" name="username" th:value="${u.username}"/>
                        <button type="submit" class="btn-delete" 
                                onclick="return confirm('Are you sure you want to delete this user? This cannot be undone.')">
                            REMOVE
                        </button>
                    </form>
                    <span th:if="${u.role == 'ADMIN'}" style="color: #555; font-size: 11px; font-style: italic;">Protected</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
