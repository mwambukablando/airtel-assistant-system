<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airtel | Inventory Reports</title>
    <style>
        :root { 
            --airtel-red: #e11d48; 
            --dark-bg: #121212; 
            --panel-bg: #1e1e1e; 
            --text-dim: #888; 
        }
        body { 
            background-color: var(--dark-bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            padding: 40px; 
            margin: 0;
        }
        .container { max-width: 1100px; margin: auto; }
        .header-section { margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        
        .report-table { 
            width: 100%; 
            border-collapse: collapse; 
            background: var(--panel-bg); 
            border-radius: 4px; 
            overflow: hidden; 
            border: 1px solid #333; 
        }
        .report-table th { 
            background: #2d2d2d; 
            color: var(--airtel-red); 
            padding: 15px; 
            text-align: left; 
            font-size: 13px; 
            text-transform: uppercase;
        }
        .report-table td { 
            padding: 15px; 
            border-bottom: 1px solid #2d2d2d; 
            font-size: 14px; 
            color: #ddd; 
        }
        .status-badge { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        .available { background: #166534; color: #bbf7d0; }
        .assigned { background: #991b1b; color: #fecaca; }
        
        .btn-back { 
            display: inline-block; 
            margin-bottom: 20px; 
            color: var(--text-dim); 
            text-decoration: none; 
            font-size: 14px; 
            border: 1px solid #444; 
            padding: 5px 15px; 
        }
        .btn-back:hover { border-color: var(--airtel-red); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <a th:href="@{/dashboard}" class="btn-back">← DASHBOARD</a>
        <h2 style="color: var(--airtel-red); margin: 10px 0 0 0;">INVENTORY STATUS REPORT</h2>
        <p style="color: var(--text-dim); font-size: 13px;">Overview of all registered assets and their current assignments.</p>
    </div>

    <table class="report-table">
        <thead>
            <tr>
                <th>Asset Tag</th>
                <th>Device Name</th>
                <th>Serial Number</th>
                <th>Category</th>
                <th>Current Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="asset : ${reportData}">
                <td th:text="${asset.tag}" style="font-weight: bold; color: white;"></td>
                <td th:text="${asset.name}"></td>
                <td th:text="${asset.serial}"></td>
                <td th:text="${asset.category}"></td>
                <td>
                    <span th:text="${asset.status}" 
                          th:classappend="${asset.status == 'AVAILABLE' ? 'status-badge available' : 'status-badge assigned'}">
                    </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reportData)}">
                <td colspan="5" style="text-align:center; padding: 30px; color: var(--text-dim);">No assets found to generate report.</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
